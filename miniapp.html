<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>TZ FX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0A0C0E;--sheet:#12151A;--ink:#F2F4F6;--dim:#8A929A;--hair:#1E2329;
  --gold:#3D9B74;--g:#3D9B74;--r:#C45C5C;--line:#1E2329;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"SF Pro Text",Tahoma,sans-serif}
body{overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;letter-spacing:.08em;font-size:13px}.brand b{color:var(--gold)}
.sub{font-size:11px;color:var(--dim);margin-top:3px}
.chip{font-size:11px;padding:6px 10px;border-radius:999px;background:var(--sheet);
  border:1px solid #2a3140;color:var(--gold);font-weight:700}
.langb{margin-left:8px;margin-right:8px;font-size:11px;padding:6px 10px;border-radius:999px;
  background:transparent;border:1px solid #2a3140;color:var(--ink)}
main{flex:1;overflow:auto;padding:4px 14px 108px;-webkit-overflow-scrolling:touch}
.hero{border-radius:18px;padding:16px;margin:6px 0 12px;background:var(--sheet);
  border:1px solid var(--hair)}
.hero h1{font-size:20px;line-height:1.35;font-weight:800}
.muted{color:var(--dim);font-size:12px;line-height:1.75}
.card{background:var(--sheet);border:1px solid var(--hair);border-radius:16px;padding:14px;margin-bottom:10px}
.card.ict{box-shadow:inset 3px 0 0 var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{padding:12px;border-radius:14px;background:#171b22;border:1px solid var(--hair);font-size:12px;font-weight:800;text-align:center}
.btn,.btn3{display:block;width:100%;margin-top:10px;border:0;border-radius:14px;padding:12px;font-weight:800}
.btn{color:#0b0d10;background:var(--gold)}
.btn3{background:#171b22;color:var(--ink);border:1px solid var(--hair)}
.nav{position:fixed;bottom:10px;left:10px;right:10px;display:flex;
  background:rgba(12,14,18,.94);backdrop-filter:blur(16px);
  border:1px solid var(--hair);border-radius:20px;padding:5px;z-index:5}
.nav button{flex:1;background:0;border:0;color:var(--dim);font-size:10px;padding:8px 1px}
.nav button.on{color:var(--gold);font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.light{min-width:58px;height:54px;border-radius:50%;display:grid;place-items:center;
  font-weight:900;font-size:11px;border:2px solid var(--hair);color:var(--dim);letter-spacing:.04em}
.light.buy{border-color:var(--g);color:var(--g)}
.light.sell{border-color:var(--r);color:var(--r)}
.light.wait{border-color:var(--gold);color:var(--gold)}
.name{font-weight:800}
.px{font-variant-numeric:tabular-nums;font-size:18px;font-weight:800}
.tag{font-size:10px;padding:3px 8px;border-radius:999px;background:#171b22;color:var(--dim)}
.tag.gold{color:var(--gold);border:1px solid #3a3320}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}
.seq{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.seq i{font-style:normal;display:flex;gap:6px;align-items:center;font-size:11px;padding:7px;border-radius:10px;background:#171b22}
.dot{width:7px;height:7px;border-radius:50%;background:#2a3140;flex-shrink:0}
.dot.on{background:var(--gold)}
.lesson{padding:11px;border-radius:14px;background:#171b22;margin-top:7px;display:flex;justify-content:space-between}
.chatbox{display:flex;flex-direction:column;gap:8px;min-height:34vh}
.bubble{padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.7;max-width:92%;white-space:pre-wrap}
.me{align-self:flex-start;background:#1c2430}
.bot{align-self:flex-end;background:#171b22;border:1px solid var(--hair)}
.bar{display:flex;gap:8px;margin-top:10px}
.bar input,.search{flex:1;background:#0b0d10;border:1px solid var(--hair);color:var(--ink);border-radius:12px;padding:11px;font-size:15px}
.note{font-size:11px;color:var(--dim);line-height:1.7;margin-top:8px}
.sk{height:78px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,#12151b,#1a1f28,#12151b);background-size:200% 100%;animation:sh 1.1s infinite}
@keyframes sh{to{background-position:-100% 0}}
.score{font-size:11px;color:var(--gold);font-weight:800}
.stat{font-size:13px;padding:8px 0}
audio{width:100%;margin-top:12px}
html[dir="ltr"] .card.ict{box-shadow:inset -3px 0 0 var(--gold)}
html[dir="ltr"] .me{align-self:flex-end}
html[dir="ltr"] .bot{align-self:flex-start}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="brand">TZ <b>FX</b></div><div class="sub" id="clock">ICT</div></div>
  <div>
    <button class="langb" id="langb" type="button">EN</button>
    <span class="chip" id="kz">—</span>
  </div>
</header>
<main id="view"></main>
<nav class="nav">
  <button class="on" data-p="home" data-fa="فارکس" data-en="Forex">فارکس</button>
  <button data-p="crypto" data-fa="کریپتو" data-en="Crypto">کریپتو</button>
  <button data-p="desk" data-fa="میز" data-en="Desk">میز</button>
  <button data-p="learn" data-fa="آموزش" data-en="Learn">آموزش</button>
  <button data-p="chat" data-fa="مربی" data-en="Mentor">مربی</button>
</nav>
</div>
<script>
const I18N={
fa:{
  wait:"صبر", buy:"بخر", sell:"بفروش",
  ictWait:"ICT: صبر کن", pay:"سیگنال با اشتراک", payBody:"سیگنال ICT و مربی با اشتراک است. آموزش برای همه باز است.",
  buySub:"خرید اشتراک", freeLearn:"آموزش رایگان",
  crypto:"کریپتو بتا", cryptoSub:"کریپتو با اشتراک", deskSub:"میز با اشتراک",
  coachSub:"چت مربی با اشتراک",
  search:"اسم کوین: PEPE ARB دوج", go:"برو", hot:"داغ‌ترین‌ها",
  desk:"میز زنده", radar:"رادار", wr:"آمار بسته", paper:"پیپر",
  donate:"حمایت از TZ FX",
  donateBody:"دونیت است، سرمایه‌گذاری نیست. شبکه را دقیق انتخاب کن.",
  donateWarn:"⚠️ شبکه اشتباه = از دست رفتن دارایی.",
  noSetup:"ستاپ زنده در رادار نیست.",
  wrNote:"درصد الکی نمی‌نویسم. از حد سود/ضرر واقعی است.",
  paperOff:"خاموش", paperOn:"روشن",
  learn:"درس ICT", learnSub:"از صفر تا اتصال صرافی. متن + صدا.",
  coach:"مربی TZ FX", coachHint:"سوالت را بنویس. جواب متن و ویس است. حافظه فقط مال توست.",
  send:"بفرست", back:"بازگشت", copy:"کپی ورود", openBot:"باز کردن در ربات",
  scan:"اسکن ICT…", miss:"داده نرسید.",
  noChase:"ورود نده تا مدل ICT کامل شود. تعقیب ممنوع.",
  disc:"آموزشی است · حد ضرر اجباری · حداکثر ۱٪ · سود تضمینی نیست.",
  lv:{1:"مبتدی",2:"ICT پایه",3:"پیشرفته",4:"اجرا",5:"API و اتصال"},
  voice:"صدای مربی",
  entry:"ورود", sl:"حد ضرر", tp:"حد سود"
},
en:{
  wait:"WAIT", buy:"BUY", sell:"SELL",
  ictWait:"ICT: WAIT", pay:"Signals require a subscription", payBody:"ICT signals and the mentor need a subscription. Lessons stay free.",
  buySub:"Subscribe", freeLearn:"Free lessons",
  crypto:"Crypto beta", cryptoSub:"Crypto requires a subscription", deskSub:"Desk requires a subscription",
  coachSub:"Mentor chat requires a subscription",
  search:"Coin name: PEPE ARB DOGE", go:"Go", hot:"Hottest",
  desk:"Live desk", radar:"Radar", wr:"Closed book", paper:"Paper",
  donate:"Support TZ FX",
  donateBody:"Donation, not an investment. Pick the exact network.",
  donateWarn:"⚠️ Wrong network can mean permanent loss.",
  noSetup:"No live setup on radar.",
  wrNote:"No invented percentage. From real TP/SL hits.",
  paperOff:"Off", paperOn:"On",
  learn:"ICT lessons", learnSub:"From zero to exchange connect. Text + voice.",
  coach:"TZ FX mentor", coachHint:"Ask a question. Reply is text + voice. Memory is yours only.",
  send:"Send", back:"Back", copy:"Copy entry", openBot:"Open in bot",
  scan:"Scanning ICT…", miss:"No data.",
  noChase:"Do not enter until the ICT model completes. Do not chase.",
  disc:"Educational · stop loss required · max 1% · no guaranteed profit.",
  lv:{1:"Beginner",2:"ICT foundation",3:"Advanced",4:"Execution",5:"API & connect"},
  voice:"Mentor voice",
  entry:"Entry", sl:"Stop loss", tp:"Take profit"
}
};
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#0b0d10");tg.setBackgroundColor("#0b0d10")}catch(e){}}
const API=(location.origin+location.pathname.replace(/\/$/,"")+"/").replace(/\/\/$/,"/");
function apiUrl(v,ex){
  let u=API+"?app=api&v="+encodeURIComponent(v)+(ex||"");
  if(tg&&tg.initData) u+="&init="+encodeURIComponent(tg.initData);
  return u;
}
function headers(){const h={"Accept":"application/json"}; if(tg&&tg.initData) h["X-Init-Data"]=tg.initData; return h}
function api(v,ex){return fetch(apiUrl(v,ex),{headers:headers(),cache:"no-store"}).then(r=>r.json()).catch(()=>({ok:false}))}
function apiPost(v, obj){
  return fetch(apiUrl(v),{method:"POST",headers:Object.assign({"Content-Type":"application/json"},headers()),body:JSON.stringify(Object.assign({v:v},obj||{}))}).then(r=>r.json()).catch(()=>({ok:false}))
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function haptic(k){try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(k||"light")}catch(e){}}
function spark(arr){
  if(!arr||arr.length<3) return "";
  const w=92,h=28,mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),d=mx-mn||1;
  const pts=arr.map((v,i)=> (i/(arr.length-1)*w).toFixed(1)+","+(h-((v-mn)/d)*(h-2)-1).toFixed(1)).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="#c9a227" stroke-width="1.7" points="${pts}"/></svg>`;
}
let LANG="fa";
function L(){return I18N[LANG]||I18N.fa}
function applyDir(){
  document.documentElement.lang=LANG==="en"?"en":"fa";
  document.documentElement.dir=LANG==="en"?"ltr":"rtl";
  document.getElementById("langb").textContent=LANG==="en"?"FA":"EN";
  document.querySelectorAll(".nav button").forEach(b=> b.textContent= LANG==="en"?b.dataset.en:b.dataset.fa);
}
function audioUrl(k){
  let u=API+"?app=audio&k="+encodeURIComponent(k)+"&v=fa2";
  if(tg&&tg.initData) u+="&init="+encodeURIComponent(tg.initData);
  return u;
}
function light(color, action){
  const t=L();
  const label= color==="buy"?t.buy: color==="sell"?t.sell: (action&&action!=="صبر"?action:t.wait);
  return `<div class="light ${color||"wait"}">${esc(label)}</div>`;
}
let S={pairs:[],crypto:[],lessons:[],pro:false,user:null,time:"",kz:"",univ:0,desk:{},lang:"fa"}, page="home", CH=[], sending=0, booted=0;
function go(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));page=p;render();haptic();
  if(p==="desk"&&!S.deskLoaded) loadDesk();
  if(p==="crypto"&&!(S.crypto&&S.crypto.length)) loadHot();
}
function openBot(s){const u="https://t.me/Tz_fx_bot?start="+(s||"sub"); if(tg) tg.openTelegramLink(u); else location.href=u}
function paywall(t){
  const x=L();
  return `<div class="hero"><h1>${esc(t||x.pay)}</h1>
    <p class="muted">${esc(x.payBody)}</p>
    <button class="btn" onclick="openBot('sub')">${esc(x.buySub)}</button>
    <button class="btn3" onclick="go('learn')">${esc(x.freeLearn)}</button>
  </div>`;
}
function cardsOf(list){
  return (list||[]).map(p=>{
    const ict=p.ict||{};
    const chg=Number(p.chg||0);
    const chgS=(chg>0?"+":"")+chg.toFixed(2)+"%";
    return `<div class="card ict" onclick="openSig('${esc(p.id)}')">
      <div class="row">
        <div><div class="name">${esc(p.emoji||"")} ${esc(p.name||p.id)}</div>
          <div class="px">${esc(p.px||"—")}</div>${spark(p.spark)}</div>
        ${light(ict.color, ict.action)}
      </div>
      <p class="muted">${esc(ict.why||"")}</p>
      <div class="meta"><span class="tag gold">ICT</span>
        <span class="tag">${esc(p.bias||"—")}</span>
        <span class="tag">${esc(p.pd||"—")}</span>
        <span class="tag">${esc(chgS)}</span>
        <span class="score">${ict.score||0}/6</span></div>
    </div>`;
  }).join("");
}
function home(){
  const t=L();
  if(!booted) return `<div class="sk"></div><div class="sk"></div>`;
  if(!S.pro) return paywall(t.pay);
  const bi=S.best_ict||{};
  const ictLive=bi.side==="BUY"||bi.side==="SELL";
  return `<div class="hero"><h1>${ictLive?("ICT: "+esc(bi.action||"")):t.ictWait}</h1>
    <p>${esc(bi.why||t.noChase)}</p>
    <p class="muted">${esc(S.time||"")} · ${esc(S.kz||"")} · EUR GBP XAU</p></div>`
    +cardsOf(S.pairs)
    +`<button class="btn3" onclick="boot(true)">${esc(t.hot==="Hottest"?"Refresh":"نوسازی")}</button>
    <p class="note">${esc(t.disc)}</p>`;
}
function crypto(){
  const t=L();
  if(!S.pro) return paywall(t.cryptoSub);
  const n=S.univ||0;
  return `<div class="hero"><h1>${esc(t.crypto)}</h1>
    <p class="muted">${n?n+" USDT":"USDT spot"} · ICT geometry · beta</p>
    <div class="bar"><input class="search" id="qcoin" placeholder="${esc(t.search)}" onkeydown="if(event.key==='Enter')findCoin()"/>
    <button class="btn" style="width:auto;margin:0;padding:12px 14px" onclick="findCoin()">${esc(t.go)}</button></div></div>`
    +(S.crypto&&S.crypto.length?cardsOf(S.crypto):`<div class="card"><p class="muted">…</p></div>`)
    +`<button class="btn3" onclick="loadHot()">${esc(t.hot)}</button>
    <p class="note">${esc(t.disc)}</p>`;
}
function findCoin(){
  const q=(document.getElementById("qcoin")||{}).value||"";
  if(!q.trim()) return;
  haptic("medium");
  const id=q.trim().toUpperCase().replace("USDT","")+"USDT";
  openSig(id);
}
function desk(){
  const t=L();
  if(!S.pro) return paywall(t.deskSub);
  const d=S.desk||{};
  const wr=d.wr||S.wr||{};
  const paper=d.paper||{};
  return `<div class="hero"><h1>${esc(t.desk)}</h1>
    <p class="muted">${esc(d.fx||S.fx||"")} · SB ${d.sb?"yes":"no"}</p>
    <p>${esc(d.news||"")}</p></div>
  <div class="grid2">
    <div class="tool" onclick="openBot('signal')">Signal</div>
    <div class="tool" onclick="openBot('wr')">Win-rate</div>
    <div class="tool" onclick="openBot('paper')">Paper</div>
    <div class="tool" onclick="openBot('connect')">Connect</div>
    <div class="tool" onclick="openBot('learn')">ICT</div>
    <div class="tool" onclick="openBot('support')">Support</div>
  </div>
  <div class="card">
    <div class="name">${esc(t.wr)}</div>
    <div class="stat">W ${wr.wins||0} · L ${wr.loss||0} · n ${wr.n||0}</div>
    <p class="note">${esc(t.wrNote)}</p>
  </div>
  <div class="card">
    <div class="name">${esc(t.paper)}</div>
    <p>${paper.on?t.paperOn:t.paperOff} · ${esc(paper.bal||"—")}</p>
    <p class="muted">${esc(t.disc)}</p>
  </div>
  <div class="card">
    <div class="name">${esc(t.radar)}</div>
    ${(d.radar||[]).map(x=>`<div class="kv"><span>${esc(x.pair)}</span><b>${esc(x.side)} ${x.sc||""}</b></div>`).join("")||"<p class='muted'>"+esc(t.noSetup)+"</p>"}
  </div>`;
}
function loadDesk(){
  api("desk").then(d=>{ if(d&&d.ok){ S.desk=d; S.deskLoaded=1; if(page==="desk") render(); }});
}
function loadHot(){
  api("hot").then(d=>{ if(d&&d.ok){ S.crypto=d.pairs||[]; S.univ=d.univ||S.univ; if(page==="crypto") render(); }});
}
function openSig(pair){
  const t=L();
  if(!S.pro){go("home");return}
  haptic("medium");
  const v=document.getElementById("view");
  v.innerHTML=`<div class="sk"></div><div class="card"><p class="muted">${esc(t.scan)}</p></div>`;
  api("signal","&pair="+encodeURIComponent(pair)).then(d=>{
    if(d&&d.pay){v.innerHTML=paywall();return}
    if(!d||!d.ok){v.innerHTML=`<div class="card">${esc(t.miss)}</div><button class="btn" onclick="go('home')">${esc(t.back)}</button>`;return}
    const ict=d.ict||{};
    const live=ict.side==="BUY"||ict.side==="SELL";
    const seq=(ict.seq||[]).map(x=>`<i><span class="dot ${x.ok?"on":""}"></span>${esc(x.name)}</i>`).join("");
    const lv= live?`<div class="kv"><span>${esc(t.entry)}</span><b>${esc(ict.entry||"—")}</b></div>
        <div class="kv"><span>${esc(t.sl)}</span><b>${esc(ict.sl||"—")}</b></div>
        <div class="kv"><span>${esc(t.tp)}</span><b>${esc(ict.tp||"—")}</b></div>
        <div class="kv"><span>R:R</span><b>${esc(ict.rr||"—")}</b></div>`:`<p class="note">${esc(t.noChase)}</p>`;
    v.innerHTML=`<div class="card ict">
      <div class="row"><div><div class="tag gold">ICT</div>
        <div class="name" style="margin-top:8px">${esc(ict.emoji||"")} ${esc(ict.name||pair)}</div>
        <p class="muted">${esc(ict.tf||"")} · ${esc(ict.kz||"")} · ${ict.score||0}/6</p></div>
        ${light(ict.color, ict.action)}</div>
      <p style="margin-top:10px">${esc(ict.why||"")}</p>
      ${lv}
      <div class="seq">${seq}</div>
      <p class="note">${esc(ict.steps||"")}</p>
    </div>
    <button class="btn" onclick="copyPx('${esc(ict.entry||"")}')">${esc(t.copy)}</button>
    <button class="btn3" onclick="openBot('signal')">${esc(t.openBot)}</button>
    <button class="btn3" onclick="go(page)">${esc(t.back)}</button>`;
  });
}
function copyPx(x){ if(!x) return; try{navigator.clipboard.writeText(String(x)); haptic("medium")}catch(e){} }
function learn(){
  const t=L();
  let html=`<div class="hero"><h1>${esc(t.learn)}</h1><p class="muted">${esc(t.learnSub)}</p></div>`;
  ["1","2","3","4","5"].forEach(Lv=>{
    const items=(S.lessons||[]).filter(x=>String(x.level)===Lv);
    if(!items.length) return;
    html+=`<div class="card"><div class="name">${LANG==="en"?"Level":"سطح"} ${Lv} · ${t.lv[Lv]||""}</div>`;
    items.forEach(it=>{
      html+=`<div class="lesson" onclick="openLesson('${esc(it.id)}')"><div>${it.n}. ${esc(it.title)}</div><div class="muted">${LANG==="en"?"Open":"باز"}</div></div>`;
    });
    html+=`</div>`;
  });
  return html;
}
function openLesson(id){
  const t=L();
  const it=(S.lessons||[]).find(x=>x.id===id);
  if(!it) return;
  const v=document.getElementById("view");
  const src=audioUrl(id);
  v.innerHTML=`<div class="card">
    <div class="tag gold">${LANG==="en"?"Lesson":"درس"} ${it.n}</div>
    <div class="name" style="margin-top:8px">${esc(it.title)}</div>
    <p class="muted">${esc(t.voice)}</p>
    <audio id="lessona" controls preload="auto" src="${src}"></audio>
    <div class="muted" style="margin-top:12px;line-height:1.85">${it.html||""}</div>
    ${it.id==="edu_25"||it.id==="edu_26"?`<button class="btn" onclick="openBot('connect')">${esc(LANG==="en"?"Open connect":"رفتن به اتصال")}</button>`:""}
    <button class="btn3" onclick="go('learn')">${esc(t.back)}</button>
  </div>`;
}
function chat(){
  const t=L();
  if(!S.pro) return paywall(t.coachSub);
  const bubbles=CH.map(m=>`<div class="bubble ${m.who}">${esc(m.t)}</div>`).join("")||`<p class="muted">${esc(t.coachHint)}</p>`;
  return `<div class="card"><div class="name">${esc(t.coach)}</div>
    <div class="chatbox" id="cbox">${bubbles}</div>
    <audio id="cvoice" controls preload="none"></audio>
    <div class="bar"><input id="cin" placeholder="${LANG==="en"?"e.g. What is FVG?":"مثلا FVG یعنی چه؟"}" onkeydown="if(event.key==='Enter')sendChat()"/>
    <button class="btn" style="width:auto;padding:12px 16px;margin:0" onclick="sendChat()">${esc(t.send)}</button></div>
  </div>`;
}
function sendChat(){
  const inp=document.getElementById("cin"); if(!inp||sending) return;
  const q=(inp.value||"").trim(); if(!q) return;
  sending=1; CH.push({who:"me", t:q}); inp.value=""; render();
  apiPost("chat",{q:q}).then(d=>{
    sending=0;
    if(d&&d.pay){CH.push({who:"bot", t:L().coachSub}); go("home"); return}
    CH.push({who:"bot", t:(d&&d.ans)||d.err||"—"});
    if(CH.length>24) CH=CH.slice(-24);
    render();
    const box=document.getElementById("cbox"); if(box) box.scrollTop=box.scrollHeight;
    const au=document.getElementById("cvoice");
    if(au && d && d.ok){ au.src=audioUrl("coach")+"&t="+Date.now(); au.play().catch(()=>{}); }
  }).catch(()=>{sending=0});
}
function render(){
  applyDir();
  const v=document.getElementById("view");
  v.innerHTML= page==="learn"?learn(): page==="chat"?chat(): page==="crypto"?crypto(): page==="desk"?desk(): home();
  document.getElementById("clock").textContent=S.time||"TZ FX";
  const kz=S.kz||"", el=document.getElementById("kz");
  el.textContent=(S.pro?"VIP · ":"")+String(kz).slice(0,22);
  if(page==="chat"){const box=document.getElementById("cbox"); if(box) box.scrollTop=box.scrollHeight;}
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
document.getElementById("langb").onclick=function(){
  const nxt=LANG==="en"?"fa":"en";
  LANG=nxt; S.lang=nxt; applyDir(); render();
  apiPost("lang",{lang:nxt});
};
function boot(force){
  api("state").then(d=>{
    if(d&&d.ok) S=Object.assign(S,d);
    if(S.lang==="en"||S.lang==="fa") LANG=S.lang;
    booted=1; render();
  }).catch(()=>{booted=1;render()});
  if(!force) render();
}
boot();
setInterval(()=>{ if(page==="home"||page==="crypto") boot(true); }, 40000);
</script>
</body>
</html>
